stages:
  - lint
  - build
  - build_docker
  - deploy

default:
  image: node:26.3.1-alpine3.24
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules

lint:
  stage: lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - npm install --frozen-lockfile
    - npm run lint

pages:
  stage: build
  variables:
    BASE_PATH: /tram-monitor/
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - rm .env.example .env.production
    - npm install --frozen-lockfile
    - npm run build
    - rm -rf public
    - mv dist public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public

build_develop:
  image:
    name: moby/buildkit:rootless
    entrypoint: [ "" ]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  stage: build_docker
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name=registry-hub.mos.ru/kbl/tram/tramfront:latest,push=true
  only:
    - master
deploy_develop:
  stage: deploy
  image: docker:29.0.2-cli
  before_script:
    - docker info
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - docker stack deploy --with-registry-auth -c docker-compose.yml vm3-dev-dits-eaistk-8-16-300
  only:
    - master